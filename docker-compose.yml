version: '3.8'

services:
  nginx-container:
    container_name: nginx-container
    depends_on:
      - vroom
    image: nginx
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf
    restart: always

  vroom:
    container_name: vroom-container
    build:
      context: .
      dockerfile: Dockerfile
    image: vroom-image
    ports:
      - '3000:3000'
    volumes:
      - ./uploads:/app/uploads
    env_file:
      - .env
    restart: always

  mysql:
    container_name: mysql-container
    image: mysql:latest
    ports:
      - '3306:3306'
    volumes:
      - /home/codie/mysql_data:/var/lib/mysql
    env_file:
      - .mysql_env
    restart: always
